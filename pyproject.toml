[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-roundtables-studio"
version = "0.9.1"
description = "Production and publishing tools for engaging multi-model AI roundtables."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
ai-roundtables = "ai_roundtables.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
